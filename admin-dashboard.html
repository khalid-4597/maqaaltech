<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Admin Dashboard — MaqaalTech</title>
<style>
  :root { --bg:#050a14; --surface:#0b1120; --border:#1e2d45; --cyan:#00e5ff; --text:#e8f0fe; }
  body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; margin: 0; }
  .sidebar { width: 250px; background: var(--surface); height: 100vh; padding: 2rem; border-right: 1px solid var(--border); position: fixed; }
  .main { flex: 1; margin-left: 250px; padding: 2rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 2rem; background: var(--surface); border-radius: 10px; }
  th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
  .action-btn { padding: 6px 12px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
  .edit { background: var(--cyan); color: #000; }
  .delete { background: #ff4d6d; color: #fff; margin-left: 5px; }
  .loading { opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>MaqaalTech</h2>
  <p style="color: var(--cyan)">Admin Panel</p>
  <hr style="border: 0.5px solid var(--border); margin: 1rem 0;">
  <button onclick="renderTable()" style="width: 100%; padding: 10px; background: none; color: white; border: 1px solid var(--border); cursor: pointer; margin-bottom: 10px;">Refresh Data</button>
  <button onclick="sessionStorage.clear(); location.href='admin-login.html'" style="width: 100%; padding: 10px; background: #ff4d6d; border: none; color: white; cursor: pointer;">Logout</button>
</div>

<div class="main" id="main-content">
  <h1>Dashboard</h1>
  <p>Live Articles from <strong>articles.json</strong> on GitHub</p>
  
  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Category</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="news-tbody"></tbody>
  </table>
</div>

<script>
  if(sessionStorage.getItem('maqaaltech_admin') !== '1') { window.location.href = 'admin-login.html'; }

  // ── CONFIGURATION (Geli xogtaada halkan) ──
  const GITHUB_TOKEN = "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"; 
  const REPO_OWNER = "khalid-4597";
  const REPO_NAME = "maqaaltech";
  const FILE_PATH = "articles.json";

  let allArticles = [];

  // 1. SOO QAAD XOGTA
  async function renderTable() {
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
        headers: { "Authorization": `token ${GITHUB_TOKEN}` }
      });
      const data = await res.json();
      allArticles = JSON.parse(decodeURIComponent(escape(atob(data.content))));
      
      const tbody = document.getElementById('news-tbody');
      tbody.innerHTML = allArticles.map(n => `
        <tr>
          <td>${n.title}</td>
          <td><span style="color: var(--cyan)">${n.category}</span></td>
          <td>${n.date}</td>
          <td>
            <button class="action-btn edit" onclick='alert("Edit function halkan ku dar")'>Edit</button>
            <button class="action-btn delete" onclick="deleteArticle(${n.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    } catch (e) { console.error("Error:", e); }
  }

  // 2. KEYDI XOGTA CUSUB GITHUB
  async function saveToGitHub(updatedData, message) {
    document.getElementById('main-content').classList.add('loading');
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
        headers: { "Authorization": `token ${GITHUB_TOKEN}` }
      });
      const fileData = await res.json();
      const sha = fileData.sha;

      const updateRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
        method: "PUT",
        headers: { "Authorization": `token ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: message,
          content: btoa(unescape(encodeURIComponent(JSON.stringify(updatedData, null, 2)))),
          sha: sha
        })
      });

      if(updateRes.ok) {
        alert("✓ GitHub waa la update-gareeyay!");
        renderTable();
      }
    } catch (e) { alert("Cilad baa dhacday!"); }
    document.getElementById('main-content').classList.remove('loading');
  }

  // 3. TIRTIRID
  function deleteArticle(id) {
    if(confirm("Ma hubtaa inaad tirtirto maqaalkan?")) {
      const filtered = allArticles.filter(n => n.id !== id);
      saveToGitHub(filtered, "Article deleted via Dashboard");
    }
  }

  window.onload = renderTable;
</script>
</body>
</html>
