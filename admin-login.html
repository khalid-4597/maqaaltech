<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login — MaqaalTech</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #050a14; --surface: #0b1120; --surface2: #111827;
    --border: #1e2d45; --cyan: #00e5ff; --cyan-dim: rgba(0,229,255,0.12);
    --cyan-glow: rgba(0,229,255,0.35); --green: #00ff94;
    --text: #e8f0fe; --text-muted: #7a92b0; --error: #ff4d6d;
    --font-head: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh; display: flex; flex-direction: column;
    overflow-x: hidden;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
    pointer-events:none; z-index:9999;
  }

  /* GRID BG */
  .bg-grid {
    position:fixed; inset:0;
    background-image: linear-gradient(var(--border) 1px,transparent 1px), linear-gradient(90deg,var(--border) 1px,transparent 1px);
    background-size:60px 60px; opacity:0.2; pointer-events:none;
  }
  .bg-orb {
    position:fixed; width:500px; height:500px; border-radius:50%;
    background: radial-gradient(circle,rgba(0,229,255,0.1) 0%,transparent 70%);
    top:50%;left:50%;transform:translate(-50%,-50%);
    animation: orbFloat 10s ease-in-out infinite; pointer-events:none;
  }
  @keyframes orbFloat{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-52%) scale(1.05)}}

  /* NAV */
  nav {
    position:relative; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 40px; height:64px;
    background:rgba(5,10,20,0.9); backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
  }
  .nav-logo { font-family:var(--font-head); font-size:22px; font-weight:800; color:var(--text); text-decoration:none; }
  .nav-logo span{color:var(--cyan);}
  .back-link { font-size:13px; color:var(--text-muted); text-decoration:none; transition:color 0.2s; display:flex; align-items:center; gap:6px; }
  .back-link:hover{color:var(--cyan);}

  /* MAIN */
  main {
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:40px 20px; position:relative; z-index:1;
  }
  .login-wrap { width:100%; max-width:420px; }

  /* SHIELD ICON */
  .icon-shield {
    width:64px; height:64px; border-radius:16px;
    background: linear-gradient(135deg, var(--cyan-dim), rgba(0,255,148,0.08));
    border:1px solid var(--cyan-glow);
    display:flex; align-items:center; justify-content:center;
    font-size:28px; margin:0 auto 28px;
    box-shadow: 0 0 30px var(--cyan-dim);
    animation: iconPulse 3s ease-in-out infinite;
  }
  @keyframes iconPulse{0%,100%{box-shadow:0 0 20px var(--cyan-dim)}50%{box-shadow:0 0 40px var(--cyan-glow)}}

  .login-title {
    font-family:var(--font-head); font-size:32px; font-weight:800;
    text-align:center; letter-spacing:-0.5px; margin-bottom:8px;
  }
  .login-sub { text-align:center; color:var(--text-muted); font-size:14px; margin-bottom:36px; }

  /* FORM */
  .form-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:36px;
    animation: cardIn 0.5s ease both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

  .form-group { margin-bottom:20px; }
  .form-label {
    display:block; font-size:12px; font-weight:600;
    letter-spacing:1px; text-transform:uppercase;
    color:var(--text-muted); margin-bottom:8px;
  }
  .form-input-wrap { position:relative; }
  .form-icon {
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    font-size:16px; opacity:0.5;
  }
  .form-input {
    width:100%; background:var(--surface2);
    border:1px solid var(--border); border-radius:10px;
    padding:13px 16px 13px 42px; color:var(--text);
    font-family:var(--font-body); font-size:15px;
    outline:none; transition:border-color 0.2s, box-shadow 0.2s;
  }
  .form-input:focus { border-color:var(--cyan); box-shadow:0 0 0 3px var(--cyan-dim); }
  .form-input.error { border-color:var(--error); }
  .eye-toggle {
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--text-muted);
    cursor:pointer; font-size:16px; padding:0;
    transition:color 0.2s;
  }
  .eye-toggle:hover{color:var(--cyan);}

  .form-error { font-size:12px; color:var(--error); margin-top:6px; display:none; }
  .form-error.show{display:block;}

  .btn-login {
    width:100%; background:var(--cyan); color:#000;
    border:none; border-radius:10px;
    padding:14px; font-family:var(--font-head); font-weight:700;
    font-size:15px; letter-spacing:0.5px;
    cursor:pointer; transition:transform 0.2s, box-shadow 0.2s;
    margin-top:8px; position:relative; overflow:hidden;
  }
  .btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 28px var(--cyan-glow);}
  .btn-login:active{transform:none;}
  .btn-login.loading{pointer-events:none;opacity:0.8;}

  /* RIPPLE */
  .ripple {
    position:absolute; border-radius:50%;
    background:rgba(0,0,0,0.2);
    transform:scale(0); animation:rippleAnim 0.6s linear;
    pointer-events:none;
  }
  @keyframes rippleAnim{to{transform:scale(4);opacity:0;}}

  /* CREDENTIALS INFO */
  .cred-info {
    margin-top:24px; padding:14px 16px;
    background:rgba(0,229,255,0.05);
    border:1px solid rgba(0,229,255,0.15);
    border-radius:10px;
  }
  .cred-info p { font-size:12px; color:var(--text-muted); line-height:1.8; }
  .cred-info strong { color:var(--cyan); }

  /* ERROR BANNER */
  .error-banner {
    background:rgba(255,77,109,0.1); border:1px solid rgba(255,77,109,0.3);
    border-radius:10px; padding:12px 16px;
    font-size:13px; color:var(--error);
    margin-bottom:20px; display:none;
    animation: fadeIn 0.3s ease;
  }
  .error-banner.show{display:flex; align-items:center; gap:8px;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  .shake { animation: shake 0.5s ease; }
  @keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-orb"></div>

<nav>
  <a href="index.html" class="nav-logo">Maqaal<span>Tech</span></a>
  <a href="index.html" class="back-link">← Back to site</a>
</nav>

<main>
  <div class="login-wrap">
    <div class="icon-shield">🛡️</div>
    <h1 class="login-title">Admin Portal</h1>
    <p class="login-sub">Sign in to manage and publish AI news</p>

    <div class="form-card">
      <div class="error-banner" id="error-banner">
        <span>⚠</span>
        <span id="error-text">Invalid credentials. Please try again.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="form-input-wrap">
          <span class="form-icon">✉️</span>
          <input class="form-input" id="email" type="email" placeholder="admin@maqaaltech.com" autocomplete="email"/>
        </div>
        <div class="form-error" id="email-error">Please enter a valid email.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="form-input-wrap">
          <span class="form-icon">🔑</span>
          <input class="form-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password"/>
          <button class="eye-toggle" id="eye-btn" type="button" onclick="togglePwd()">👁</button>
        </div>
        <div class="form-error" id="pwd-error">Password is required.</div>
      </div>

      <button class="btn-login" id="login-btn" onclick="login(event)">
        <span id="btn-text">Sign In</span>
      </button>

      <div class="cred-info">
        <p>Demo credentials:<br/>
        <strong>Email:</strong> admin@maqaaltech.com<br/>
        <strong>Password:</strong> Admin@2025</p>
      </div>
    </div>
  </div>
</main>

<script>
  // Auto-fill on hint click
  document.querySelector('.cred-info').onclick = () => {
    document.getElementById('email').value = 'admin@maqaaltech.com';
    document.getElementById('password').value = 'Admin@2025';
  };

  function togglePwd(){
    const p=document.getElementById('password');
    p.type = p.type==='password' ? 'text' : 'password';
    document.getElementById('eye-btn').textContent = p.type==='password' ? '👁' : '🙈';
  }

  function login(e){
    const btn=document.getElementById('login-btn');
    // Ripple
    const r=document.createElement('span'); r.className='ripple';
    const rect=btn.getBoundingClientRect(); const size=Math.max(rect.width,rect.height);
    r.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
    btn.appendChild(r); setTimeout(()=>r.remove(),600);

    let valid=true;
    const email=document.getElementById('email').value.trim();
    const pwd=document.getElementById('password').value;

    document.getElementById('email-error').classList.remove('show');
    document.getElementById('pwd-error').classList.remove('show');
    document.getElementById('error-banner').classList.remove('show');
    document.getElementById('email').classList.remove('error');
    document.getElementById('password').classList.remove('error');

    if(!email||!email.includes('@')){ document.getElementById('email-error').classList.add('show'); document.getElementById('email').classList.add('error'); valid=false; }
    if(!pwd){ document.getElementById('pwd-error').classList.add('show'); document.getElementById('password').classList.add('error'); valid=false; }
    if(!valid) return;

    btn.classList.add('loading');
    document.getElementById('btn-text').textContent='Signing in…';

    setTimeout(()=>{
      if(email==='admin@maqaaltech.com' && pwd==='Admin@2025'){
        sessionStorage.setItem('maqaaltech_admin', '1');
        document.getElementById('btn-text').textContent='✓ Welcome!';
        setTimeout(()=>{ window.location.href='admin-dashboard.html'; },600);
      } else {
        btn.classList.remove('loading');
        document.getElementById('btn-text').textContent='Sign In';
        document.getElementById('error-banner').classList.add('show');
        document.getElementById('error-text').textContent='Invalid credentials. Please try again.';
        document.querySelector('.form-card').classList.add('shake');
        setTimeout(()=>document.querySelector('.form-card').classList.remove('shake'),500);
      }
    },1000);
  }

  // Enter key
  document.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('login-btn').click(); });
</script>
</body>
</html>
