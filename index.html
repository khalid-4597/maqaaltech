<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MaqaalTech — AI News</title>
    <style>
        :root { --bg: #050a14; --surface: #0b1120; --border: #1e2d45; --cyan: #00e5ff; --text: #e8f0fe; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 10px; margin-bottom: 20px; cursor: pointer; }
        .card:hover { border-color: var(--cyan); }
        .card h2 { margin-top: 0; color: var(--cyan); }
        #debug-info { color: #ff4d6d; font-size: 0.8rem; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>MAQAALTECH</h1>
    <div id="debug-info">Cilad-baaris: Fiirinaya xogta...</div>
    <div id="main-content">
        </div>
</div>

<script>
    async function saveToGitHub(data, msg) {
    document.getElementById('loader').style.display = 'flex';
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
        headers: { "Authorization": `token ${GITHUB_TOKEN}` }
      });
      const fileData = await res.json();
      const sha = fileData.sha;

      const updateRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
        method: "PUT",
        headers: { 
            "Authorization": `token ${GITHUB_TOKEN}`, 
            "Content-Type": "application/json",
            "Accept": "application/vnd.github+json"
        },
        body: JSON.stringify({
          message: msg,
          content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
          sha: sha
        })
      });

      if (updateRes.status === 403 || updateRes.status === 404) {
          const errorMsg = await updateRes.json();
          alert("Galoofis! GitHub ayaa kuu diiday: " + errorMsg.message);
      } else if(updateRes.ok) {
          alert("✓ Hadda ayay dhab ka tahay! GitHub waa la cusboonaysiiyay.");
          resetForm();
          loadData();
      }
    } catch (e) { 
        alert("Cilad farsamo: " + e.message); 
    }
    document.getElementById('loader').style.display = 'none';
}
</script>
</body>
</html>
