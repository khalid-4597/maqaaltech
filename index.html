<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MaqaalTech — AI News</title>
    <style>
        :root { --bg: #050a14; --surface: #0b1120; --border: #1e2d45; --cyan: #00e5ff; --text: #e8f0fe; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 10px; margin-bottom: 20px; cursor: pointer; }
        .card:hover { border-color: var(--cyan); }
        .card h2 { margin-top: 0; color: var(--cyan); }
        #debug-info { color: #ff4d6d; font-size: 0.8rem; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>MAQAALTECH</h1>
    <div id="debug-info">Cilad-baaris: Fiirinaya xogta...</div>
    <div id="main-content">
        </div>
</div>

<script>
    async function loadArticles() {
        const debug = document.getElementById('debug-info');
        const content = document.getElementById('main-content');
        
        try {
            // Waxaan isticmaaleynaa dhowr hab si looga gudbo Cache-ga
            const res = await fetch('articles.json?nocache=' + new Date().getTime());
            if (!res.ok) throw new Error("articles.json lama helin!");
            
            const data = await res.json();
            debug.innerText = "Xogta waa la helay: " + data.length + " maqaal ayaa ku jira.";
            debug.style.color = "#00e5ff";

            content.innerHTML = data.map(n => `
                <div class="card">
                    <small style="color:var(--cyan)">${n.category} | ${n.date}</small>
                    <h2>${n.title}</h2>
                    <p>${n.excerpt}</p>
                    <hr style="border:0.1px solid var(--border)">
                    <div style="font-size:0.9rem; line-height:1.6;">${n.body}</div>
                </div>
            `).join('');

        } catch (e) {
            debug.innerText = "Cilad: " + e.message;
            content.innerHTML = "<p>Weli wax maqaal ah lama soo gelin ama articles.json ayaa maqan.</p>";
        }
    }

    window.onload = loadArticles;
</script>
</body>
</html>
